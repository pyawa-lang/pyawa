[package]
name = "pyawa-lsp"
description = "Pyawa 的 LSP 服务（LSP 线②：诊断＋hover；零第三方依赖的手写 JSON-RPC 2.0／LSP 帧）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# 只依赖 workspace 内部（`CX-27`：第三方只许在 pyawa-lsp，但本实现**零第三方** ⇒ 不新增依赖）
pyawa-core = { path = "../pyawa-core" }

[[bin]]
name = "pyawa-lsp"
path = "src/main.rs"
