[package]
name = "pyawa-runtime"
description = "Pyawa 独立运行时的真实机器能力实现与入口（REPL/CLI）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# 组合根装配（`CM-14`）：内建名字空间与 `sys`（含 `stdout`）由 CLI 装上 ⇒ 是**运行**依赖 ✓
pyawa-stdlib = { path = "../pyawa-stdlib" }
# `DESIGN.md` §12：`pyawa-runtime` 是**组合根**（依赖各 crate，供 CLI／REPL 用）
pyawa-abi = { path = "../pyawa-abi" }
# `SPEC-capabilities.md` §9 的域形状（`CP-12`：接口 crate 只含形状）；组合根装备真实实现
pyawa-capabilities = { path = "../pyawa-capabilities" }
pyawa-core = { path = "../pyawa-core" }

[lib]
# **§12.13 #1（路线 A）**：组合根产物——C 宿主链**这一个**库就拿到 `paL_*` ＋ 完整 `pa_*`
# （`staticlib` 必含依赖 rlib 的 `#[no_mangle]` 符号；`cdylib` 另行实测再定）。
crate-type = ["rlib", "cdylib", "staticlib"]

[dev-dependencies]
