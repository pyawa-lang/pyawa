name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

# 与 AGENTS.md「硬线」一致：
#  - fast：每次 push/PR —— check.py（18 项，秒级）＋ 构建 ＋ ABI/核心测试 ＋ pyawa check 语料
#  - wasm：每次 push/PR —— Web（WASM）E1–E5 构建与 node 冒烟（PLAN §12.21）
#  - windows：每次 push/PR —— Windows 最小"能编译"＋ provider／os 形状测试 ＋ core/lsp 测试
#              ＋ 参考宿主（MSVC）（PLAN §12.20 W1–W6 首批；M3-COVERAGE 显式 SKIP；
#              Windows 不做 memcheck——口径见 RELEASE）
#  - full：PR／手动／每周 —— slowcheck 11 项（含基准闸：性能回退 + memcheck 子集）
# 同一 PR 的新 push 取消旧 run（文档/提交迭代时尤其省时间；不取消 main 的独立 run）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: 快速闸门（check.py ＋ 构建 ＋ 测试）
    runs-on: ubuntu-latest
    # runner 的 apt 安装偶发 10+ 分钟 ⇒ 20 分钟会误杀（PR #3 实测）；放宽到 30 只吸收环境抖动。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # T-CX-15 要用 git cat-file 解析 NEXT 里的旧短哈希 ⇒ 需要完整历史（默认浅克隆会红）
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          # 缓存 cargo registry 与 target；Windows/完整档最受益。
          workspaces: "."
      - name: 环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind gcc
          rustc --version && cargo --version
      - name: 构建（release）
        run: tools/cargo.sh build --release -p pyawa-runtime --bin pyawa
      # 必须先跑 ABI 测试：M3-COVERAGE 的 ④⑤ 依赖它产出的
      # target/conformance/{self-check.md,report.md}（target/ 不进仓库）
      - name: ABI ＋ 核心 ＋ LSP 测试（release）
        run: tools/cargo.sh test --release -p pyawa-abi -p pyawa-core -p pyawa-lsp
      - name: 文档/规格/编号闸门（18 项）
        run: python3 tests/ci/check.py
      # P0-2（PLAN §12.26）：归一化白名单自身的自检（规则坏了要立刻红，而不是等两平台比对）
      - name: portability 归一化自检
        run: python3 tests/portability/runner.py --self-test
      # PLAN §11.1 ④：check.py 之后对 407 语料（.py）跑 pyawa check——只编译不执行，
      # 期望 0 诊断、退出码 0（LSP 线①的语料回归闸）。
      # S3 参考宿主（异步）：宿主 loop 用 pa_resume 驱动生成器＋event 域注册。
      - name: S3 参考宿主（异步，Linux）
        run: python3 tests/ci/t_ref_host_async.py
      # P0-3 宿主 loop 参考适配器：native poll(2) event provider＋任务表＋超时。
      - name: 宿主 loop 参考适配器（native event provider，Linux）
        run: python3 tests/ci/t_ref_host_loop.py
      - name: pyawa check 语料（407 个 .py ⇒ 0 诊断）
        run: |
          awk -F'\t' 'NF>=2 && $1 !~ /^#/ {print "tests/conformance/corpus/" $1}' \
            tests/conformance/corpus/manifest.tsv > /tmp/pyawa-check-corpus.txt
          wc -l /tmp/pyawa-check-corpus.txt
          target/release/pyawa check $(cat /tmp/pyawa-check-corpus.txt)

  wasm:
    name: Web（WASM）冒烟（PLAN §12.21 E1–E5 ＋ §12.22 S4）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # 缓存 cargo registry 与 target；Windows/完整档最受益。
          workspaces: "."
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 安装 wasm32 目标
        run: rustup target add wasm32-unknown-unknown
      # E1：平台门控；只构建库（宿主 bin 不是 wasm 产物，E1 起在 wasm 侧留空 main 桩）
      - name: wasm 构建（E1 平台门控）
        run: tools/cargo.sh build --workspace --lib --target wasm32-unknown-unknown --release
      # 产物：pyawa_abi.wasm 无 import；pyawa_runtime.wasm 的 import 面＝E2 宿主调用 ＋ E4 clock 三条。
      - name: E2 宿主函数（trampoline）
        run: node tests/wasm/e2_host_function.js target/wasm32-unknown-unknown/release/pyawa_runtime.wasm
      - name: E3 ABI 面（pa_create／exec／errmsg）
        run: node tests/wasm/e3_abi_surface.js target/wasm32-unknown-unknown/release/pyawa_runtime.wasm
      - name: E4 JS clock（fs／net 如实"未提供"）
        run: node tests/wasm/e4_js_clock.js target/wasm32-unknown-unknown/release/pyawa_runtime.wasm
      - name: E5 纯计算／协议派发冒烟
        run: node tests/wasm/e5_smoke.js target/wasm32-unknown-unknown/release/pyawa_runtime.wasm
      # **S4（§12.22）**：显式帧栈下的深递归在 wasm 小栈上同样成立
      - name: E6 显式帧栈深递归（wasm）
        run: node tests/wasm/e6_recursion.js target/wasm32-unknown-unknown/release/pyawa_runtime.wasm
      # **P1 库嵌入档**（PLAN §12.26）：多实例／宿主函数／stdout 经宿主
      - name: E7 wasm 库嵌入（多实例／宿主函数／stdout）
        run: node tests/wasm/e7_embedding.js target/wasm32-unknown-unknown/release/pyawa_runtime.wasm
      - name: E8 wasm 可移植子集（canonical raw）
        run: node tests/wasm/e8_portability.js target/wasm32-unknown-unknown/release/pyawa_runtime.wasm --out portability-wasm-raw.json
      - name: E8 归一化（复用 tests/portability/runner.py 的一处真相）
        run: python3 tests/portability/runner.py --raw-json portability-wasm-raw.json --out portability-wasm.json --platform-label wasm32
      - uses: actions/upload-artifact@v4
        with:
          name: portability-wasm
          path: portability-wasm.json
          if-no-files-found: error

  # Windows 拆分：并行子 job ＋ **同名聚合门**（required check 不变）。
  windows-build:
    name: Windows 构建与冒烟
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: 构建（Windows 目标：libs ＋ bins）
        run: cargo build --workspace
        shell: bash
      - name: Windows ABI 全 targets 可编译（W6）
        run: cargo check -p pyawa-abi --all-targets
        shell: bash
      - name: Windows runtime 全 targets 可编译（W6）
        run: cargo check -p pyawa-runtime --all-targets
        shell: bash
      - name: Windows asyncio 冒烟
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cli-probe
          cat > cli-probe/asyncio_smoke.py <<'PY'
          import asyncio
          async def coro(n):
              await asyncio.sleep(0)
              return n * 2
          async def agen(n):
              for i in range(n):
                  yield i
          async def main():
              await asyncio.sleep(0.01)
              values = [x async for x in agen(3)]
              gathered = await asyncio.gather(coro(1), coro(2), coro(3))
              async with asyncio.TaskGroup() as tg:
                  t1 = tg.create_task(coro(4))
                  t2 = tg.create_task(coro(5))
              return values, gathered, t1.result(), t2.result()
          print("asyncio", asyncio.run(main()))
          PY
          out=$(target/debug/pyawa.exe cli-probe/asyncio_smoke.py)
          test "$out" = "asyncio ([0, 1, 2], [2, 4, 6], 8, 10)"
          echo "$out"
      # 实验：显式 Proactor 策略跑最基本 asyncio.run（不切默认；超时保护）。
      - name: Windows Proactor 基本运行探针（实验）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cli-probe
          cat > cli-probe/proactor_probe.py <<'PY'
          import asyncio.windows_utils as wu
          try:
              p = wu.Popen(["cmd.exe", "/d", "/c", "echo", "wu"], stdout=wu.PIPE)
              out, _ = p.communicate()
              print("wu-popen", out.strip())
          except BaseException as exc:
              print("wu-popen-error", type(exc).__name__, exc)
          import asyncio
          import asyncio.events
          import asyncio.windows_events
          asyncio.events._set_event_loop_policy(
              asyncio.windows_events._WindowsProactorEventLoopPolicy())
          async def coro(n):
              return n * 2
          async def main():
              await asyncio.sleep(0.01)
              got = await asyncio.gather(coro(1), coro(2))
              async with asyncio.TaskGroup() as tg:
                  task = tg.create_task(coro(3))
              return got, task.result()
          import traceback
          try:
              print("proactor", asyncio.run(main()))
          except BaseException:
              traceback.print_exc()
          PY
          timeout 30 target/debug/pyawa.exe cli-probe/proactor_probe.py

      # 实验：asyncio.windows_utils.pipe()（Proactor subprocess 的管道构造基础）。
      - name: Windows Proactor windows_utils.pipe 探针（实验）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cli-probe
          cat > cli-probe/proactor_pipe_probe.py <<'PY'
          import _winapi
          import asyncio.windows_utils as wu
          h1, h2 = wu.pipe()
          _winapi.CloseHandle(h1)
          _winapi.CloseHandle(h2)
          print("windows_utils-pipe", isinstance(h1, int), isinstance(h2, int))
          PY
          timeout 30 target/debug/pyawa.exe cli-probe/proactor_pipe_probe.py

      # 实验：msvcrt.open_osfhandle/get_osfhandle（windows_utils.Popen 的前置）。
      - name: Windows Proactor msvcrt 句柄探针（实验）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cli-probe
          cat > cli-probe/proactor_msvcrt_probe.py <<'PY'
          import _winapi
          import msvcrt
          import os
          r, w = _winapi.CreatePipe(None, 0)
          fd = msvcrt.open_osfhandle(w, 0)
          back = msvcrt.get_osfhandle(fd)
          ok = (back == w)
          os.close(fd)
          _winapi.CloseHandle(r)
          print("msvcrt-osfhandle", ok)
          PY
          timeout 30 target/debug/pyawa.exe cli-probe/proactor_msvcrt_probe.py

      - name: Windows 原生 CLI 冒烟（PLAN §12.23 选项 A）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cli-probe
          printf 'x = 1 + 2\n' > cli-probe/probe.py
          target/debug/pyawa.exe -c "x = 6 * 7"
          target/debug/pyawa.exe cli-probe/probe.py
          target/debug/pyawa.exe check cli-probe/probe.py

  windows-conformance:
    name: Windows conformance 对拍
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - name: conformance（Windows 对拍）
        timeout-minutes: 15
        env:
          PYAWA_REFERENCE_PYTHON: python
        run: cargo test -p pyawa-abi --test conformance -- the_corpus_has_no_new_divergences --exact
        shell: bash

  windows-tests:
    name: Windows 测试矩阵
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - name: runtime 运行矩阵（Windows）
        timeout-minutes: 30
        run: cargo test -p pyawa-runtime --no-fail-fast
        shell: bash
      - name: Windows ABI 测试（W6）
        run: cargo test -p pyawa-abi --test abi --test annotation_strings --test boundary_guard --test capability_acceptance --test capability_layout --test capability_registration --test header --test helpers_wiring --test host_module --test host_path --test host_signature --test host_usability --test host_visibility --test memory_quota --test object_ops --test protocol_host_dispatch --test protocol_oracle --test type_identity --test write_tobytes
        shell: bash
      - name: Windows provider／os 形状测试
        run: cargo test -p pyawa-runtime --test windows_clock_shapes --test windows_fs_shapes --test windows_net_shapes --test windows_os_shapes --test windows_winstubs_shapes --test windows_winreg --test windows_overlapped --test windows_platform_gaps -- --test-threads=1
        shell: bash
      - name: Windows 平台中立测试（core ＋ lsp）
        run: cargo test -p pyawa-core -p pyawa-lsp
        shell: bash
      - name: 不变量闸门（静态检查；M3-COVERAGE 显式 SKIP）
        run: python tests/ci/check.py
        shell: bash
        env:
          PYAWA_CHECK_SKIP_COVERAGE: "1"

  windows-reference:
    name: Windows 参考宿主（MSVC）
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - uses: ilammy/msvc-dev-cmd@v1
      - name: 参考宿主（MSVC）
        run: python tests/ci/t_ref_host.py --release
        shell: bash

  # required check 名保持不变：聚合门只在所有 Windows 子 job 成功后通过。
  windows:
    name: Windows 最小构建（PLAN §12.20 W1）
    if: always()
    needs: [windows-build, windows-conformance, windows-tests, windows-reference]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总 Windows 子 job
        run: |
          set -eu
          test "${{ needs.windows-build.result }}" = "success"
          test "${{ needs.windows-conformance.result }}" = "success"
          test "${{ needs.windows-tests.result }}" = "success"
          test "${{ needs.windows-reference.result }}" = "success"
          echo "Windows 子 job 全部通过"

  portability:
    name: 脚本可移植性（P0-2：${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # 缓存 cargo registry 与 target；Windows/完整档最受益。
          workspaces: "."
      # 本 job 只需任意 Python 3（runner 仅用标准库）；**不**装 3.14.4——Ubuntu 26.04 镜像
      # 没有该版本的 setup-python 构建（首跑实测红），而参照版本只在 conformance 需要。
      - name: 构建 pyawa（debug）
        run: cargo build -p pyawa-runtime --bin pyawa
      - name: 跑可移植语料（canonical JSON）
        run: ${{ matrix.python }} tests/portability/runner.py --out portability-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: portability-${{ matrix.os }}
          path: portability-${{ matrix.os }}.json
          if-no-files-found: error

  portability-compare:
    name: 脚本可移植性（Linux×Windows 比对）
    needs: [portability, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: portability-*
          merge-multiple: true
      - name: 同脚本跨平台同结果（Linux×Windows）
        run: python3 tests/portability/compare.py portability-ubuntu-latest.json portability-windows-latest.json
      # P1：wasm 库嵌入档的**可移植子集**（无 fs/Lib ⇒ 纯计算＋Rust 模块；asyncio-on-wasm 未承诺）
      - name: 同脚本同结果（Linux×WASM 子集）
        run: python3 tests/portability/compare.py --subset-file tests/portability/wasm_subset.txt portability-ubuntu-latest.json portability-wasm.json

  full:
    name: 完整闸门（slowcheck 11 项）
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # T-CX-15 要用 git cat-file 解析 NEXT 里的旧短哈希 ⇒ 需要完整历史（默认浅克隆会红）
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          # 缓存 cargo registry 与 target；Windows/完整档最受益。
          workspaces: "."
      - name: 环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind gcc
          rustc --version && cargo --version
      # slowcheck 的第 5 项（check.py 的 M3-COVERAGE ④⑤）依赖 conformance 测试产出的
      # target/conformance/{self-check.md,report.md}；本地有残留，CI 全新 clone 必须先生成
      - name: 生成 conformance 报告（供 slowcheck 第 5 项使用）
        run: tools/cargo.sh test --release -p pyawa-abi --test conformance
      - name: slowcheck（11 项：含基准闸＝性能回退 ＋ memcheck 子集）
        run: tools/slowcheck.sh --release

      - name: 上传失败日志（artifact）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slowcheck-logs-${{ github.job }}
          path: |
            target/slowcheck/*.log
            target/conformance/*.md
          if-no-files-found: ignore

  weekly:
    name: 每周全量（slowcheck ＋ 内存棘轮）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # T-CX-15 要用 git cat-file 解析 NEXT 里的旧短哈希 ⇒ 需要完整历史（默认浅克隆会红）
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          # 缓存 cargo registry 与 target；Windows/完整档最受益。
          workspaces: "."
      - name: 环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind gcc
      # slowcheck 的第 5 项（check.py 的 M3-COVERAGE ④⑤）依赖 conformance 测试产出的
      # target/conformance/{self-check.md,report.md}；本地有残留，CI 全新 clone 必须先生成
      - name: 生成 conformance 报告（供 slowcheck 第 5 项使用）
        run: tools/cargo.sh test --release -p pyawa-abi --test conformance
      - name: slowcheck
        run: tools/slowcheck.sh --release

      - name: 上传失败日志（artifact）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slowcheck-logs-${{ github.job }}
          path: |
            target/slowcheck/*.log
            target/conformance/*.md
          if-no-files-found: ignore
      - name: 全量内存棘轮（memdangle_survey）
        run: python3 tools/memdangle_survey.py --seconds 3000 || true
